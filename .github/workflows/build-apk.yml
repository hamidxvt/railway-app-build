name: Build & Release APK

# This repo is public purely so its release APK assets are downloadable
# by the Bookmark mobile app with no authentication, and so CI here runs
# on GitHub's unlimited free Actions minutes for public repos, instead of
# eating into the private hamidxvt/Bookmark-app repo's metered quota. The
# actual source code lives in Bookmark-app and is checked out fresh each
# run via SOURCE_REPO_TOKEN (a fine-grained PAT scoped to read-only
# access on that one repo) — nothing from it is committed here.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # The release step needs write access to push tags and upload assets
    # to THIS repo (the default GITHUB_TOKEN is scoped to the repo the
    # workflow runs in, so this is enough — no cross-repo token needed
    # for the release itself, only for the checkout step below).
    permissions:
      contents: write

    steps:
      - name: Checkout source (private repo)
        uses: actions/checkout@v4
        with:
          repository: hamidxvt/Bookmark-app
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'

      - name: Get dependencies
        working-directory: source/mobile
        run: flutter pub get

      # Reconstitutes the dedicated release keystore from repo secrets so
      # every CI build is signed with the SAME key as every other build
      # (local or CI) — an "update" signed by a different key than what's
      # already on the device gets refused by Android ("App not
      # installed"), so this has to stay in lockstep across build
      # environments.
      - name: Set up release signing
        working-directory: source/mobile/android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d ' \t\n\r' | base64 -d > bookmark-release.jks
          keytool -list -keystore bookmark-release.jks -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > /dev/null
          cat > key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=bookmark-release
          storeFile=bookmark-release.jks
          EOF

      # Bump the Android versionCode using this repo's own run number
      # before building, so every release gets a strictly increasing
      # code without hand-editing pubspec.yaml in the source repo.
      - name: Bump versionCode
        id: bump
        working-directory: source/mobile
        run: |
          SEMVER=$(grep "^version:" pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          NEW_BUILD=${GITHUB_RUN_NUMBER}
          sed -i "s/^version: .*/version: ${SEMVER}+${NEW_BUILD}/" pubspec.yaml
          echo "version=${SEMVER}" >> $GITHUB_OUTPUT
          echo "build=${NEW_BUILD}" >> $GITHUB_OUTPUT
          echo "Bumped pubspec to ${SEMVER}+${NEW_BUILD}"

      - name: Build APK
        working-directory: source/mobile
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: source/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: source/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          # Tag encodes semver AND build number so the backend's
          # fetchLatestGitHubRelease can derive the exact versionCode by
          # splitting the tag on '+' — same convention as the old
          # Bookmark-app workflow, kept so nothing downstream has to
          # change its parsing.
          tag_name: v${{ steps.bump.outputs.version }}+${{ steps.bump.outputs.build }}
          name: v${{ steps.bump.outputs.version }} build ${{ steps.bump.outputs.build }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
